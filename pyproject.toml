[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "testpilot-1c"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.121,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "networkx>=3.4,<4", "httpx>=0.28,<1", "jinja2>=3.1,<4", "scikit-learn>=1.6,<2", "pytest>=8,<10", "playwright>=1.56,<2"]
[tool.setuptools.packages.find]
include = ["testpilot*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools.package-data]
"testpilot.web" = ["static/*"]
