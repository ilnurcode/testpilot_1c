name: tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (PostgreSQL 17, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: testpilot
          POSTGRES_PASSWORD: testpilot
          POSTGRES_DB: testpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testpilot -d testpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://testpilot:testpilot@localhost:5432/testpilot
      TP_TEST_DATABASE_URL: postgresql+psycopg://testpilot:testpilot@localhost:5432/testpilot_test
      TP_TEST_EXPECT_DB: testpilot_test
      TP_TEST_INSTANCE_TOKEN: ci-testpilot-disposable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements.lock

      - name: Браузер для сценариев веб-клиента
        run: python -m playwright install --with-deps chromium

      - name: Отдельная тестовая БД
        run: |
          PGPASSWORD=testpilot psql -h localhost -U testpilot -d testpilot -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE testpilot_test'
          PGPASSWORD=testpilot psql -h localhost -U testpilot -d testpilot -v ON_ERROR_STOP=1 \
            -c "COMMENT ON DATABASE testpilot_test IS 'ci-testpilot-disposable'"

      - name: Миграции (рабочая схема CI)
        run: alembic upgrade head

      - name: Страж undefined names (pyflakes)
        run: |
          python -m pip install pyflakes
          python -m pyflakes testpilot/ migrations/ tests/ 2>&1 | tee /tmp/pyflakes.txt || true
          if grep -q "undefined name" /tmp/pyflakes.txt; then
            echo "Найдены undefined name (F821) — исправьте их перед продолжением"
            grep "undefined name" /tmp/pyflakes.txt
            exit 1
          fi

      - name: Тесты
        run: python -m pytest tests/ -q

  acceptance:
    name: приёмка на собранном стеке
    # Последовательно с pytest: сборка образа с Chromium и полная приёмка дорогие,
    # и нет смысла запускать стек, если юнит-тесты уже красные.
    needs: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Изоляция: CI работает в собственном compose-проекте и не может задеть локальный `testpilot`.
      COMPOSE_PROJECT_NAME: testpilot-ci
      # Локальные стендовые пароли (не секреты): compose и приёмка читают те же значения.
      TP_ANALYST_PASSWORD: TestPilotAnalystLocal123!
      TP_EXPERT_PASSWORD: TestPilotLocal123!
      TP_RUNNER_PASSWORD: TestPilotRunnerLocal123!
      POSTGRES_PASSWORD: TestPilot_Db_Local_Only_2026
    steps:
      - uses: actions/checkout@v4

      - name: Одноразовый env стенда (изолированные порты и фиктивные credentials)
        run: |
          mkdir -p .runtime
          cat > .runtime/ci.env <<'EOF'
          POSTGRES_USER=testpilot
          POSTGRES_PASSWORD=TestPilot_Db_Local_Only_2026
          POSTGRES_DB=testpilot_ci
          TP_ANALYST_PASSWORD=TestPilotAnalystLocal123!
          TP_EXPERT_PASSWORD=TestPilotLocal123!
          TP_RUNNER_PASSWORD=TestPilotRunnerLocal123!
          TP_DB_HOST_PORT=15432
          TP_IMPACT_HOST_PORT=18001
          TP_INTEL_HOST_PORT=18002
          TP_WEB_HOST_PORT=18000
          TP_1C_ODATA_URL=
          TP_1C_WEB_URL=
          TP_1C_USERNAME=
          TP_1C_PASSWORD=
          TP_1C_AUTHORIZATION=
          TP_LLM_API_KEY=
          TP_INSTANCE_TOKEN=ci-instance-token
          EOF

      - name: "CI: только БД, затем marker"
        env:
          TP_DISPOSABLE_IDENTITY: testpilot-ci
        run: |
          bash scripts/compose.sh -p testpilot-ci --env-file .runtime/ci.env up -d --wait db
          bash scripts/compose.sh -p testpilot-ci --env-file .runtime/ci.env exec -T db \
            psql -U testpilot -d testpilot_ci -c "COMMENT ON DATABASE testpilot_ci IS 'ci-instance-token'"

      - name: "CI: явная инициализация схемы (profile init, disposable DB)"
        env:
          TP_DISPOSABLE_IDENTITY: testpilot-ci
        run: |
          bash scripts/compose.sh -p testpilot-ci --env-file .runtime/ci.env --profile init run --rm --build migrate \
            python scripts/schema_actions.py --init
          bash scripts/compose.sh -p testpilot-ci --env-file .runtime/ci.env --profile init run --rm migrate \
            python scripts/schema_state.py --require-head

      - name: "Стек: приложения после явного init"
        env:
          TP_DISPOSABLE_IDENTITY: testpilot-ci
        run: bash scripts/compose.sh -p testpilot-ci --env-file .runtime/ci.env up -d --build --wait

      - name: "Полная приёмка (без ИИ и живой 1С)"
        env:
          TP_ACCEPTANCE_PROJECT: testpilot-ci
          TP_ACCEPTANCE_EXPECT_DB: testpilot_ci
          TP_ACCEPTANCE_DISPOSABLE: '1'
          TP_ACCEPTANCE_COMPOSE_FILE: compose.yaml
          TP_ACCEPTANCE_ENV_FILE: .runtime/ci.env
          TP_ACCEPTANCE_INSTANCE_TOKEN: ci-instance-token
          TP_EXPERT_PASSWORD: TestPilotLocal123!
        run: bash scripts/acceptance.sh --no-build

      - name: Логи контейнеров при падении
        if: failure()
        run: bash scripts/compose.sh -p testpilot-ci --env-file .runtime/ci.env logs --no-color > logs.txt

      - name: Выгрузить логи
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-logs
          path: |
            logs.txt
            .runtime/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Остановить стек
        if: always()
        env:
          TP_DISPOSABLE_IDENTITY: testpilot-ci
        run: bash scripts/compose.sh -p testpilot-ci --env-file .runtime/ci.env down -v
